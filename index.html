<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PassForge — Generate secure, cryptographically strong passwords instantly." />
  <title>PassForge — Secure Password Generator</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

  <!-- Ambient background orbs -->
  <div class="orbs" aria-hidden="true">
    <span class="orb orb-purple"></span>
    <span class="orb orb-cyan"></span>
    <span class="orb orb-pink"></span>
    <span class="orb orb-purple-2"></span>
  </div>

  <main class="page">

    <!-- Header -->
    <header class="app-header">
      <h1 class="app-title">PassForge</h1>
      <p class="app-subtitle">Generate secure passwords instantly</p>
    </header>

    <!-- Generator Card -->
    <section class="glass-card generator-card" aria-label="Password generator">

      <!-- Password Display -->
      <div class="password-display" title="">
        <span id="passwordText" class="password-text" aria-live="polite">••••••••••••••••</span>
        <div class="password-actions">
          <button id="copyBtn" class="icon-btn" aria-label="Copy password" title="Copy">
            <i data-lucide="copy"></i>
          </button>
          <button id="regenBtn" class="icon-btn" aria-label="Regenerate password" title="Regenerate">
            <i data-lucide="refresh-cw"></i>
          </button>
        </div>
      </div>

      <!-- Strength Meter -->
      <div class="strength">
        <div class="strength-labels">
          <span class="strength-title">Strength</span>
          <span id="strengthLabel" class="strength-value">—</span>
        </div>
        <div class="strength-bar" id="strengthBar">
          <span class="seg"></span>
          <span class="seg"></span>
          <span class="seg"></span>
          <span class="seg"></span>
        </div>
      </div>

      <!-- Length Slider -->
      <div class="length-row">
        <div class="length-labels">
          <label for="lengthSlider">Password Length</label>
          <span id="lengthValue" class="length-value">16</span>
        </div>
        <input
          id="lengthSlider"
          class="length-slider"
          type="range"
          min="4"
          max="32"
          value="16"
          step="1"
        />
      </div>

      <!-- Character Options -->
      <div class="options-grid">
        <label class="option-toggle">
          <input type="checkbox" data-opt="uppercase" checked />
          <span class="pill"><i data-lucide="check"></i></span>
          <span class="opt-label">Uppercase <em>(A-Z)</em></span>
        </label>
        <label class="option-toggle">
          <input type="checkbox" data-opt="lowercase" checked />
          <span class="pill"><i data-lucide="check"></i></span>
          <span class="opt-label">Lowercase <em>(a-z)</em></span>
        </label>
        <label class="option-toggle">
          <input type="checkbox" data-opt="numbers" checked />
          <span class="pill"><i data-lucide="check"></i></span>
          <span class="opt-label">Numbers <em>(0-9)</em></span>
        </label>
        <label class="option-toggle">
          <input type="checkbox" data-opt="symbols" checked />
          <span class="pill"><i data-lucide="check"></i></span>
          <span class="opt-label">Symbols <em>(!@#$)</em></span>
        </label>
      </div>

      <!-- Generate Button -->
      <button id="generateBtn" class="generate-btn">
        <i data-lucide="lock-keyhole"></i>
        <span>Generate Password</span>
      </button>

    </section>

    <!-- History Panel -->
    <section class="glass-card history-card" aria-label="Password history">
      <div class="history-header">
        <span class="history-title">Recent Passwords</span>
        <button id="clearHistoryBtn" class="ghost-btn">Clear All</button>
      </div>
      <ul id="historyList" class="history-list">
        <li class="history-empty" id="historyEmpty">
          <i data-lucide="lock"></i>
          <p>Your generated passwords will appear here</p>
        </li>
      </ul>
    </section>

    <footer class="footer">
      <p>Cryptographically secure · No data leaves your browser</p>
    </footer>

  </main>

  <!-- Toast notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js" defer></script>
</body>
</html>
